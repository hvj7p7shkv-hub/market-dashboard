name: Refresh market dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".refresh-market-dashboard"
      - "scripts/**"
      - "requirements-market-dashboard.txt"
      - ".github/workflows/refresh-market-dashboard.yml"
  schedule:
    # GitHub cron uses UTC. Run from 09:23 IST through the 15:33 close snapshot
    # on weekdays, offset from round clock times to reduce scheduler delays.
    - cron: "53 3 * * 1-5"
    - cron: "3,13,23,33,43,53 4-9 * * 1-5"
    - cron: "3 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-dashboard-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MARKET_DASHBOARD_ROOT: ${{ github.workspace }}
      MARKET_DASHBOARD_DATA_ROOT: ${{ github.workspace }}/data

    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-market-dashboard.txt

      - name: Install dashboard dependencies
        run: python -m pip install -r requirements-market-dashboard.txt

      - name: Refresh market wires
        run: |
          if ! python scripts/fetch_ai_market_news_wires.py --days 1 --limit 80 --output-dir data/market_news_wires; then
            echo "::notice::Market wires could not be refreshed. The dashboard will use the latest available wire snapshot."
          fi

      - name: Refresh mutual fund NAVs
        run: |
          if ! python scripts/fetch_amfi_mutual_fund_navs.py --watchlist data/mutual_fund_watchlist.json --output-dir data/mutual_fund_navs; then
            echo "::notice::Mutual fund NAVs could not be refreshed. The dashboard will use the latest available NAV snapshot."
          fi

      - name: Refresh Nifty 500 highs
        run: |
          if ! python scripts/fetch_nse_nifty500_52w_highs.py --output-dir data/nse_52w_highs --universe-csv data/nifty500_universe/ind_nifty500list.csv; then
            echo "::notice::Nifty 500 highs could not be refreshed. The dashboard will use the latest available highs snapshot."
          fi

      - name: Refresh Nifty 50 rotation
        run: python scripts/nifty50_rotation_analysis.py --period 1y --output-dir data/nifty50_rotation

      - name: Refresh Nifty 500 rotation
        run: >-
          python scripts/nifty500_rotation_analysis.py
          --period 1y
          --output-dir data/nifty500_rotation
          --universe-csv data/nifty500_universe/ind_nifty500list.csv
          --min-coverage 0.85

      - name: Refresh live breadth and volume
        run: >-
          python scripts/live_market_snapshot.py
          --tracked-universe data/batch_52w_technical/technical_ranked_summary.csv
          --nifty500-universe data/nifty500_universe/ind_nifty500list.csv
          --output data/live_market/latest-live-market-snapshot.json
          --min-screen-coverage 0.70
          --min-nifty500-coverage 0.70

      - name: Build dashboard snapshot
        run: >-
          python scripts/build_market_dashboard.py
          --output-dir docs
          --all-wires
          --india-breadth-limit 120
          --nifty500-rotation-limit 15
          --min-index-coverage 0.70
          --min-valid-index-coverage 0.60
          --max-index-stale-days 3
          --index-outlier-pct 12
          --min-breadth-coverage 0.70
          --min-nifty500-coverage 0.85
          --live-market-snapshot data/live_market/latest-live-market-snapshot.json
          --require-aligned-market-date
          --include-bear-note-text
          --bear-notes data/bear_dashboard_notes/latest-bear-watchlist-notes.json

      - name: Publish refreshed snapshot
        shell: bash
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "market-dashboard-bot@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "Dashboard is already current."
          else
            git commit -m "Auto-refresh market dashboard"
            git push
          fi
